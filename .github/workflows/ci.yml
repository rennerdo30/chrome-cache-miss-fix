name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          for file in $(find src tools tests -name '*.js' -o -name '*.mjs'); do
            node --check "$file"
          done

      - name: Validate manifest, locales and message keys
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Verify icons are up to date
        run: |
          npm run icons
          if ! git diff --quiet -- icons; then
            echo "icons/ differs from tools/make-icons.mjs output; run 'npm run icons' and commit."
            git diff --stat -- icons
            exit 1
          fi

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create extension package
        run: |
          mkdir -p dist
          zip -r dist/chrome-cache-miss-fix.zip \
            manifest.json \
            src/ \
            icons/ \
            _locales/ \
            LICENSE \
            -x "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: dist/chrome-cache-miss-fix.zip
          retention-days: 7

      - name: Display package contents
        run: unzip -l dist/chrome-cache-miss-fix.zip

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build
